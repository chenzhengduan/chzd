site_name: 实用知识库
site_description: 销售流程、短视频拍摄、社交平台账号运营、跨境电商、阿里巴巴电商与运营学习笔记
site_url: https://chenzhengduan.github.io/chzd/
docs_dir: docs
site_dir: .site

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

extra_css:
  - assets/styles/mobile.css
  - assets/styles/resume.css
  - assets/styles/shooting.css
  - assets/styles/platforms.css
  - assets/styles/sales.css
  - assets/styles/growth.css
  - assets/styles/knowledge.css
  - assets/styles/mobile-nav.css

exclude_docs: |
  /cross-border-ecommerce/overview.md
  /cross-border-ecommerce/progress.md
  /cross-border-ecommerce/temp_line.txt
  /cross-border-ecommerce/git/
  /cross-border-ecommerce/00-知识刷新/inventory/
  /cross-border-ecommerce/00-知识刷新/reports/
  /cross-border-ecommerce/daily/*
  !/cross-border-ecommerce/daily/index.md
  !/cross-border-ecommerce/daily/2026-05-11.md
  !/cross-border-ecommerce/daily/2026-05-07.md
  !/cross-border-ecommerce/daily/2026-05-06-2304-learning-summary.md
  !/cross-border-ecommerce/daily/2026-05-06-2258.md
  !/cross-border-ecommerce/daily/2026-05-06-2248.md

plugins:
  - awesome-pages:
      sort_type: natural
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

hooks:
  - hooks/standalone_title.py
